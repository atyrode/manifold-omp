name: manifold plugins

on:
  push:
    branches: [main]
    paths:
      ["package.json", "plugins/**", ".github/workflows/manifold-plugins.yml"]
  pull_request:
    paths:
      ["package.json", "plugins/**", ".github/workflows/manifold-plugins.yml"]

permissions:
  contents: read

jobs:
  plugins:
    # This workflow and MANIFOLD_REV pin the same published native SDK.
    # The reusable job installs only CI containment fixtures; this repository
    # has no fleet-daemon installation or production/release deployment job.
    uses: atyrode/manifold/.github/workflows/plugins.yml@82db11220212cfa22dbaab5a4069a88ca8ec42f9
    with:
      plugins-dir: plugins
      prepare-command: bun --no-env-file --no-install workers/build.ts --prepare-dependencies && bun --no-env-file --no-install scripts/prepare-ci.ts
      pack-verify-command: OMP_CONSUMER_SOURCE=github:${{ github.repository }}#${{ github.event.pull_request.head.sha || github.sha }} bun --no-env-file --no-install scripts/verify.ts
