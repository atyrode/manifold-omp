name: manifold plugins

on:
  push:
    branches: [main]
    paths:
      ["package.json", "plugins/**", ".github/workflows/manifold-plugins.yml"]
  pull_request:
    paths:
      ["package.json", "plugins/**", ".github/workflows/manifold-plugins.yml"]

permissions:
  contents: read

jobs:
  plugins:
    # This workflow and MANIFOLD_REV pin the same verified native SDK revision.
    # The reusable job installs only CI containment fixtures; this repository
    # has no fleet-daemon installation or deployment job. release.yml publishes
    # a tag's verified bundles as release assets and installs nothing; this gate
    # packs and verifies the same way, so verify's in-unit pack must reproduce
    # the host pack's SHA256SUMS on every change, not first at a tag.
    uses: atyrode/manifold/.github/workflows/plugins.yml@82605419ea9a67198d9ea0dae1257a8fd812ecd8
    with:
      plugins-dir: plugins
      prepare-command: bun --no-env-file --no-install workers/build.ts --prepare-dependencies && bun --no-env-file --no-install scripts/prepare-ci.ts
      pack-verify-command: |
        bun run pack
        OMP_VERIFY_EXPECTED_SUMS="$PWD/dist/SHA256SUMS" OMP_CONSUMER_SOURCE=github:${{ github.repository }}#${{ github.event.pull_request.head.sha || github.sha }} bun --no-env-file --no-install scripts/verify.ts
