name: Release

# A `v*` tag push publishes the three native family bundles, the complete SDK-host
# and grammar archives, and their SHA256SUMS. A manual dispatch from main with both
# `tag` and `draft_id` instead recovers that existing tag's held draft: the
# dispatched (controller) revision supplies only this workflow, while every source
# check, build and proof runs on the commit the tag names. `bundles` refuses a tag
# that does not name the family version on a commit main has, then runs the
# repository gate on the tagged commit beside Manifold at plugins/MANIFOLD_REV;
# verify repacks the family in its disposable unit and fails unless it reproduces
# the packed bytes. A push creates its draft and uploads those bytes by release ID;
# a recovery never creates, uploads, replaces or deletes assets. Either way the
# draft becomes a held prerelease only if its assets are exactly the freshly
# qualified bytes. Only `publish-candidate` and `promote` can write, and neither
# runs repository code. Public HTTPS/native proof must pass between publication and
# promotion; a failed check or proof leaves its draft or candidate held, never
# deleted, replaced or promoted.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose held draft to recover (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      draft_id:
        description: Numeric ID of that tag's held draft release
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundles:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      draft-id: ${{ steps.source.outputs.draft-id }}
      controller-sha: ${{ steps.source.outputs.controller-sha }}
    steps:
      # A push builds the commit its tag names. A recovery must be dispatched from
      # main; its inputs are validated before any API call, and its tag's commit,
      # not the controller's, is the source every later job checks out and binds.
      - name: Select the tagged source commit and any held draft
        id: source
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT_ID: ${{ inputs.draft_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)
              [ -z "$INPUT_TAG" ] && [ -z "$INPUT_DRAFT_ID" ] || { echo "A tag push takes no recovery inputs"; exit 1; }
              tag="$GITHUB_REF_NAME"
              draft_id=""
              ;;
            workflow_dispatch)
              [ "$GITHUB_REF" = refs/heads/main ] || { echo "Recovery runs only from refs/heads/main, not $GITHUB_REF"; exit 1; }
              [ -n "$INPUT_TAG" ] && [ -n "$INPUT_DRAFT_ID" ] || { echo "Recovery requires both tag and draft_id"; exit 1; }
              [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vMAJOR.MINOR.PATCH"; exit 1; }
              [[ "$INPUT_DRAFT_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "draft_id must be a positive release ID"; exit 1; }
              tag="$INPUT_TAG"
              draft_id="$INPUT_DRAFT_ID"
              ;;
            *) echo "Unsupported event $EVENT"; exit 1 ;;
          esac
          source="$(gh api "repos/$REPOSITORY/commits/refs/tags/$tag" --jq .sha)"
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo "tag $tag does not name a commit"; exit 1; }
          if [ "$EVENT" = push ]; then
            [ "$source" = "$GITHUB_SHA" ] || { echo "tag $tag now names $source; this push was $GITHUB_SHA"; exit 1; }
          else
            status="$(gh api "repos/$REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
            case "$status" in
              identical | behind) ;;
              *) echo "Controller $GITHUB_SHA is $status relative to main; dispatch from main"; exit 1 ;;
            esac
          fi
          status="$(gh api "repos/$REPOSITORY/compare/main...$source" --jq .status)"
          case "$status" in
            identical | behind) ;;
            *) echo "$source is $status relative to main; tag a commit main has"; exit 1 ;;
          esac
          {
            echo "tag=$tag"
            echo "source-sha=$source"
            echo "draft-id=$draft_id"
            echo "controller-sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          printf 'Tag %s; source %s; controller %s; draft %s\n' "$tag" "$source" "$GITHUB_SHA" "${draft_id:-created by this run}" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.source-sha }}
          path: caller
          persist-credentials: false
      - name: Require the checked-out source to name the tag's family version
        env:
          TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
        run: |
          set -euo pipefail
          head="$(git -C caller rev-parse HEAD)"
          [ "$head" = "$SOURCE_SHA" ] || { echo "Checked out $head; tag $TAG names $SOURCE_SHA"; exit 1; }
          want="${TAG#v}"
          for manifest in caller/package.json caller/plugins/atyrode.omp/manifest.json \
            caller/plugins/atyrode.omp/accounts/manifest.json caller/plugins/atyrode.omp/gateway/manifest.json; do
            got="$(jq -er .version "$manifest")"
            [ "$got" = "$want" ] || { echo "$manifest is version $got; tag $TAG names $want"; exit 1; }
          done
      - name: Read the pinned Manifold revision
        id: manifold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rev="$(tr -d '[:space:]' < caller/plugins/MANIFOLD_REV)"
          [[ "$rev" =~ ^[a-f0-9]{40}$ ]] || { echo "MANIFOLD_REV must be a full lowercase SHA"; exit 1; }
          status="$(gh api "repos/atyrode/manifold/compare/main...$rev" --jq .status)"
          case "$status" in
            identical | behind) ;;
            *) echo "$rev is $status relative to Manifold main; pin a commit main has"; exit 1 ;;
          esac
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: atyrode/manifold
          ref: ${{ steps.manifold.outputs.rev }}
          path: manifold
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install Manifold's dependencies
        working-directory: manifold
        run: bun install --frozen-lockfile
      - name: Install Linux containment fixtures
        working-directory: manifold
        run: bash scripts/install-runtime-ci.sh
      - name: Verify real machine jobs
        working-directory: manifold
        run: bash scripts/verify-runtime.sh --system jobs
      - name: Install the plugins' dependencies
        working-directory: caller/plugins
        run: bun install --frozen-lockfile
      - name: Prepare the SDK graphs and native verification resources
        working-directory: caller/plugins
        run: |
          bun --no-env-file --no-install workers/build.ts --prepare-dependencies
          python3 scripts/prepare-grammar-assets.py
          bun --no-env-file --no-install scripts/prepare-ci.ts
      - name: Typecheck
        working-directory: caller/plugins
        run: bun run check
      - name: Unit tests
        working-directory: caller/plugins
        run: bun test
      - name: Pack
        working-directory: caller/plugins
        run: bun run pack
      # The in-unit pack must reproduce dist/SHA256SUMS, so the proven family is
      # the published one. The consumer gate installs the public API from GitHub
      # at the tagged commit.
      - name: Verify the packed family natively and as a public consumer
        working-directory: caller/plugins
        run: |
          OMP_VERIFY_EXPECTED_SUMS="$PWD/dist/SHA256SUMS" \
          OMP_CONSUMER_SOURCE="github:$GITHUB_REPOSITORY#$(git rev-parse HEAD)" \
            bun --no-env-file --no-install scripts/verify.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omp-plugins
          path: |
            caller/plugins/dist/*.manifold-plugin.json
            caller/plugins/dist/omp-sdkHost.tar.gz
            caller/plugins/dist/omp-grammars-v1.tar.gz
            caller/plugins/dist/SHA256SUMS
          if-no-files-found: error
          overwrite: true

  publish-candidate:
    needs: bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.publish.outputs.id }}
    env:
      TAG: ${{ needs.bundles.outputs.tag }}
      SOURCE_SHA: ${{ needs.bundles.outputs.source-sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omp-plugins
          path: dist
      - name: Require exactly the complete checksummed family and runtime assets
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          listed="$(awk '{ print $2 }' SHA256SUMS | sort)"
          packed="$(printf '%s\n' atyrode.omp.manifold-plugin.json atyrode.omp.accounts.manifold-plugin.json \
            atyrode.omp.gateway.manifold-plugin.json omp-sdkHost.tar.gz omp-grammars-v1.tar.gz | sort)"
          actual="$(find . -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected="$(printf '%s\n' "$packed" SHA256SUMS | sort)"
          [ "$actual" = "$expected" ] || { echo "Incomplete or unexpected release asset set"; exit 1; }
          [ "$listed" = "$packed" ] || {
            printf 'SHA256SUMS lists:\n%s\npacked:\n%s\n' "$listed" "$packed"
            exit 1
          }
          want="${TAG#v}"
          for bundle in *.manifold-plugin.json; do
            got="$(jq -er .manifest.version "$bundle")"
            [ "$got" = "$want" ] || { echo "$bundle is version $got; tag $TAG names $want"; exit 1; }
          done
      # A push creates its draft and uploads the qualified bytes to that captured ID;
      # a recovery binds its held draft by ID and never creates, uploads, replaces or
      # deletes assets. The tag already exists, so creation binds to it.
      - name: Create and fill a draft by ID, or bind the held draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_ID: ${{ needs.bundles.outputs.draft-id }}
          CONTROLLER_SHA: ${{ needs.bundles.outputs.controller-sha }}
        run: |
          set -euo pipefail
          commit="$(gh api "repos/$REPOSITORY/commits/refs/tags/$TAG" --jq .sha)"
          [ "$commit" = "$SOURCE_SHA" ] || { echo "tag $TAG now names $commit; this run built $SOURCE_SHA"; exit 1; }
          if [ -n "$DRAFT_ID" ]; then
            id="$DRAFT_ID"
          else
            id="$(gh api --method POST "repos/$REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$SOURCE_SHA" \
              -f name="$TAG" -F draft=true -F prerelease=true -F generate_release_notes=true -f make_latest=false --jq .id)"
            [[ "$id" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "Draft creation returned no release ID"; exit 1; }
            echo "Created held draft release $id for $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
            # The previous step proved dist holds exactly the fixed canonical asset names.
            for file in dist/*; do
              name="$(basename "$file")"
              [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Unsafe asset name $name"; exit 1; }
              gh api --method POST "https://uploads.github.com/repos/$REPOSITORY/releases/$id/assets?name=$name" \
                -H "Content-Type: application/octet-stream" --input "$file" --silent
            done
          fi
          echo "Controller $CONTROLLER_SHA binds release $id to $TAG at $SOURCE_SHA"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Publish the draft as a held prerelease only if it holds exactly the qualified bytes
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          want="$(for file in dist/*; do
            jq -n --arg name "$(basename "$file")" --argjson size "$(stat -c %s "$file")" \
              --arg digest "sha256:$(sha256sum "$file" | cut -d' ' -f1)" '{name, size, digest}'
          done | jq -cs 'sort_by(.name)')"
          metadata="$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID")"
          jq -e --arg id "$RELEASE_ID" --arg tag "$TAG" --argjson want "$want" '
            (.id | tostring) == $id and .tag_name == $tag and .draft == true and .prerelease == true
            and (.assets | length) == ($want | length)
            and ([.assets[] | select(.state == "uploaded") | {name, size, digest}] | sort_by(.name)) == $want
          ' <<< "$metadata" >/dev/null || {
            echo "Release $RELEASE_ID is not a $TAG draft holding exactly the qualified assets; refusing publication"
            jq '{id, tag_name, draft, prerelease, assets: [.assets[] | {name, state, size, digest}]}' <<< "$metadata"
            exit 1
          }
          commit="$(gh api "repos/$REPOSITORY/commits/refs/tags/$TAG" --jq .sha)"
          [ "$commit" = "$SOURCE_SHA" ] || { echo "Tag moved before candidate publication"; exit 1; }
          published="$(gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=true -f make_latest=false)"
          jq -e --arg id "$RELEASE_ID" --arg tag "$TAG" \
            '(.id | tostring) == $id and .tag_name == $tag and .draft == false and .prerelease == true' <<< "$published" >/dev/null
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  public-proof:
    needs: [bundles, publish-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      assets-digest: ${{ steps.release.outputs.assets }}
    env:
      TAG: ${{ needs.bundles.outputs.tag }}
      SOURCE_SHA: ${{ needs.bundles.outputs.source-sha }}
      RELEASE_ID: ${{ needs.publish-candidate.outputs.release-id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.bundles.outputs.source-sha }}
          path: caller
          persist-credentials: false
      - name: Read the pinned Manifold revision
        id: manifold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rev="$(tr -d '[:space:]' < caller/plugins/MANIFOLD_REV)"
          [[ "$rev" =~ ^[a-f0-9]{40}$ ]] || { echo "MANIFOLD_REV must be a full lowercase SHA"; exit 1; }
          status="$(gh api "repos/atyrode/manifold/compare/main...$rev" --jq .status)"
          case "$status" in
            identical | behind) ;;
            *) echo "$rev is $status relative to Manifold main; pin a commit main has"; exit 1 ;;
          esac
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: atyrode/manifold
          ref: ${{ steps.manifold.outputs.rev }}
          path: manifold
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Pin the published candidate and acquire every asset through public HTTPS
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          commit="$(gh api "repos/$REPOSITORY/commits/refs/tags/$TAG" --jq .sha)"
          [ "$commit" = "$SOURCE_SHA" ] || { echo "Candidate tag differs from built source"; exit 1; }
          [ "$(git -C caller rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo "Proof checkout differs from built source"; exit 1; }
          metadata="$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID")"
          jq -e --arg id "$RELEASE_ID" --arg tag "$TAG" \
            '(.id | tostring) == $id and .tag_name == $tag and .draft == false and .prerelease == true' <<< "$metadata" >/dev/null
          expected="$(printf '%s\n' atyrode.omp.manifold-plugin.json atyrode.omp.accounts.manifold-plugin.json \
            atyrode.omp.gateway.manifold-plugin.json omp-sdkHost.tar.gz omp-grammars-v1.tar.gz SHA256SUMS | sort)"
          [ "$(jq -r '.assets[].name' <<< "$metadata" | sort)" = "$expected" ]
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "assets=$(jq -cS '[.assets[] | {id,name,size,digest,updated_at}] | sort_by(.name)' <<< "$metadata" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # No bearer or owner credentials accompany these versioned HTTPS downloads.
          mkdir public-release
          while IFS= read -r file; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              "https://github.com/$REPOSITORY/releases/download/$TAG/$file" --output "public-release/$file"
          done <<< "$expected"
          (cd public-release && sha256sum --check --strict SHA256SUMS)
          while IFS= read -r file; do
            digest="sha256:$(sha256sum "public-release/$file" | cut -d' ' -f1)"
            jq -e --arg name "$file" --arg digest "$digest" --argjson size "$(stat -c %s "public-release/$file")" \
              '[.assets[] | select(.name == $name and .state == "uploaded" and .size == $size and .digest == $digest)] | length == 1' <<< "$metadata" >/dev/null ||
              { echo "Public $file differs from the candidate's recorded size or digest"; exit 1; }
          done <<< "$expected"
      - name: Prepare the independent graphs and fresh native containment fixtures
        run: |
          set -euo pipefail
          (cd manifold && bun install --frozen-lockfile && bash scripts/install-runtime-ci.sh)
          (cd caller/plugins && bun install --frozen-lockfile && \
            bun --no-env-file --no-install workers/build.ts --prepare-dependencies && \
            python3 scripts/prepare-grammar-assets.py && \
            bun --no-env-file --no-install scripts/prepare-ci.ts)
      - name: Prove published bytes with normal HTTPS acquisition and a fresh native owner
        working-directory: caller/plugins
        run: |
          OMP_VERIFY_EXPECTED_SUMS="$GITHUB_WORKSPACE/public-release/SHA256SUMS" \
          OMP_CONSUMER_SOURCE="github:$GITHUB_REPOSITORY#$(git rev-parse HEAD)" \
            bun --no-env-file --no-install scripts/verify.ts --published-assets
      - name: Require the proven asset identities to remain unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ASSETS: ${{ steps.release.outputs.assets }}
          EXPECTED_RELEASE: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$REPOSITORY/releases/$EXPECTED_RELEASE")"
          [ "$(jq -er .id <<< "$metadata")" = "$EXPECTED_RELEASE" ]
          actual="$(jq -cS '[.assets[] | {id,name,size,digest,updated_at}] | sort_by(.name)' <<< "$metadata" | sha256sum | cut -d' ' -f1)"
          [ "$actual" = "$EXPECTED_ASSETS" ] || { echo "Published assets changed during proof"; exit 1; }

  promote:
    needs: [bundles, public-proof]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.bundles.outputs.tag }}
      SOURCE_SHA: ${{ needs.bundles.outputs.source-sha }}
      REPOSITORY: ${{ github.repository }}
      EXPECTED_RELEASE: ${{ needs.public-proof.outputs.release-id }}
      EXPECTED_ASSETS: ${{ needs.public-proof.outputs.assets-digest }}
    steps:
      # No checkout, downloaded scripts or repository code in either write-granted job.
      - name: Promote only the already-proven candidate's status flags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          commit="$(gh api "repos/$REPOSITORY/commits/refs/tags/$TAG" --jq .sha)"
          [ "$commit" = "$SOURCE_SHA" ] || { echo "Tag differs from proven source"; exit 1; }
          metadata="$(gh api "repos/$REPOSITORY/releases/$EXPECTED_RELEASE")"
          jq -e --arg id "$EXPECTED_RELEASE" --arg tag "$TAG" \
            '(.id | tostring) == $id and .tag_name == $tag and .draft == false and .prerelease == true' <<< "$metadata" >/dev/null
          actual="$(jq -cS '[.assets[] | {id,name,size,digest,updated_at}] | sort_by(.name)' <<< "$metadata" | sha256sum | cut -d' ' -f1)"
          [ "$actual" = "$EXPECTED_ASSETS" ] || { echo "Assets differ from the public proof"; exit 1; }
          promoted="$(gh api --method PATCH "repos/$REPOSITORY/releases/$EXPECTED_RELEASE" -F prerelease=false -f make_latest=true)"
          jq -e --arg id "$EXPECTED_RELEASE" \
            '(.id | tostring) == $id and .draft == false and .prerelease == false' <<< "$promoted" >/dev/null
